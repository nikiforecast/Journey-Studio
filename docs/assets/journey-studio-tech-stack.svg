<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="680" viewBox="0 0 1200 680" version="1.1">
  <title>Journey Studio Tech Stack</title>
  <desc>Architecture: React SPA, Netlify hosting, Supabase data layer, OpenAI, MCP and Slack.</desc>

  <defs>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9ca3af"/>
    </marker>
    <marker id="ahb" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>

  <text x="40" y="44" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold">Journey Studio - Tech Stack</text>
  <text x="40" y="68" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="14">User journeys, research notes, product discovery (KYP)</text>

  <rect x="32" y="92" width="1136" height="78" rx="6" fill="#f9fafb" stroke="none"/>
  <rect x="32" y="188" width="1136" height="100" rx="6" fill="#eff6ff" stroke="none"/>
  <rect x="32" y="306" width="1136" height="100" rx="6" fill="#f0fdf4" stroke="none"/>
  <rect x="32" y="424" width="560" height="88" rx="6" fill="#fffbeb" stroke="none"/>
  <rect x="608" y="424" width="560" height="88" rx="6" fill="#faf5ff" stroke="none"/>

  <text x="44" y="108" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" letter-spacing="1">CLIENT</text>
  <text x="44" y="204" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" letter-spacing="1">HOSTING - NETLIFY</text>
  <text x="44" y="322" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" letter-spacing="1">DATA AND AUTH - SUPABASE</text>
  <text x="44" y="440" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" letter-spacing="1">AI</text>
  <text x="620" y="440" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" letter-spacing="1">INTEGRATIONS</text>

  <!-- Connectors (drawn behind boxes) -->
  <g id="connectors" fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <!-- 1. Users -> React SPA -->
    <path stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)" d="M 164 142 L 220 142"/>

    <!-- 2. React SPA -> Netlify CDN (static deploy) -->
    <path stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)" d="M 300 174 L 300 200 L 308 200 L 308 208"/>

    <!-- 3. React SPA -> Netlify Functions (AI jobs) -->
    <path stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)" d="M 480 174 L 480 200 L 542 200 L 542 208"/>

    <!-- 4. React SPA -> Supabase Auth (left gutter) -->
    <path stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)" d="M 250 174 L 188 174 L 188 310 L 294 310 L 294 326"/>

    <!-- 5. React SPA -> Supabase API (direct CRUD, right of CDN) -->
    <path stroke="#2563eb" stroke-width="1.5" marker-end="url(#ahb)" d="M 420 174 L 420 305 L 480 305 L 480 326"/>

    <!-- 6. Netlify Functions -> Netlify Blobs -->
    <path stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)" d="M 652 232 L 688 232"/>

    <!-- 7. Netlify Functions -> OpenAI (bottom channel) -->
    <path stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)" d="M 542 256 L 542 412 L 150 412 L 150 444"/>

    <!-- 8. Netlify Functions -> Supabase API (service role, right gutter) -->
    <path stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)" d="M 652 232 L 1090 232 L 1090 350 L 564 350"/>

    <!-- 9. Supabase API -> PostgreSQL -->
    <path stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)" d="M 564 350 L 592 350"/>

    <!-- 10. Edge Functions -> Slack -->
    <path stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)" d="M 852 374 L 852 408 L 910 408 L 910 444"/>

    <!-- 11. MCP Connector -> Supabase API (bottom channel) -->
    <path stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ah)" d="M 732 492 L 732 528 L 480 528 L 480 374"/>
  </g>

  <g id="client-users" transform="translate(56,118)">
    <rect x="0" y="0" width="108" height="48" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="54" y="20" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Users</text>
    <text x="54" y="36" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Researchers, PMs</text>
  </g>

  <g id="client-spa" transform="translate(220,110)">
    <rect x="0" y="0" width="300" height="64" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="150" y="22" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">React SPA</text>
    <text x="150" y="38" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Vite, TypeScript, Tailwind, React Router</text>
    <text x="150" y="54" fill="#374151" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle">XYFlow, BlockNote, dnd-kit</text>
  </g>

  <g id="hosting-cdn" transform="translate(220,208)">
    <rect x="0" y="0" width="176" height="48" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="88" y="20" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Netlify CDN</text>
    <text x="88" y="36" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Static deploy</text>
  </g>

  <g id="hosting-functions" transform="translate(432,208)">
    <rect x="0" y="0" width="220" height="48" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="110" y="20" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Netlify Functions</text>
    <text x="110" y="36" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Serverless, 15m background jobs</text>
  </g>

  <g id="hosting-blobs" transform="translate(688,208)">
    <rect x="0" y="0" width="148" height="48" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="74" y="20" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Netlify Blobs</text>
    <text x="74" y="36" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Job status polling</text>
  </g>

  <g id="supabase-auth" transform="translate(220,326)">
    <rect x="0" y="0" width="148" height="48" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="74" y="20" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Supabase Auth</text>
    <text x="74" y="36" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Email, Google OAuth</text>
  </g>

  <g id="supabase-api" transform="translate(396,326)">
    <rect x="0" y="0" width="168" height="48" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="84" y="20" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Supabase API</text>
    <text x="84" y="36" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">PostgREST, RLS</text>
  </g>

  <g id="supabase-pg" transform="translate(592,326)">
    <rect x="0" y="0" width="148" height="48" rx="5" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="74" y="20" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PostgreSQL</text>
    <text x="74" y="36" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Workspaces, journeys</text>
  </g>

  <g id="supabase-edge" transform="translate(768,326)">
    <rect x="0" y="0" width="168" height="48" rx="5" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
    <text x="84" y="20" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Edge Functions</text>
    <text x="84" y="36" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Slack, Auth0 sync, invites</text>
  </g>

  <g id="ai-openai" transform="translate(56,444)">
    <rect x="0" y="0" width="188" height="48" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <text x="94" y="20" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">OpenAI</text>
    <text x="94" y="36" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Vision, transcripts, journey AI</text>
  </g>

  <g id="int-mcp" transform="translate(632,444)">
    <rect x="0" y="0" width="200" height="48" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="100" y="20" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">MCP Connector</text>
    <text x="100" y="36" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Claude Cowork, Node.js</text>
  </g>

  <g id="int-slack" transform="translate(860,444)">
    <rect x="0" y="0" width="100" height="48" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1"/>
    <text x="50" y="20" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Slack</text>
    <text x="50" y="36" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">Notes</text>
  </g>

  <!-- Connector labels (on top) -->
  <rect x="424" y="278" width="72" height="16" rx="3" fill="#ffffff"/>
  <text x="428" y="290" fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">direct CRUD</text>

  <rect x="1054" y="238" width="68" height="16" rx="3" fill="#ffffff"/>
  <text x="1058" y="250" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="9">service role</text>

  <text x="40" y="648" fill="#9ca3af" font-family="Arial, Helvetica, sans-serif" font-size="10">Source: KYP repo. Primary auth: Supabase Auth. Deploy: Netlify (dist) + Supabase migrations.</text>
  <text x="40" y="664" fill="#9ca3af" font-family="Arial, Helvetica, sans-serif" font-size="10">Env: VITE_SUPABASE_* (client), OPENAI_API_KEY + SUPABASE_SERVICE_KEY (Netlify functions).</text>
</svg>
